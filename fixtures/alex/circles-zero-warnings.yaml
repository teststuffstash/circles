# Fixture variant: the bake-clean configuration — CIR-BAKE-ARTIFACT#warnings-empty-array
# (specs/data/data-json.md) and CIR-BAKE-WARNINGS#no-warnings-no-banner.
#
# This is the SAME fixture person as `fixtures/alex/circles.yaml` (same rings, same ids,
# same labels, same guardrails) — a VARIANT of Alex, not a second synthetic person
# (CIR-PROC-TEST-FIXTURES#fixture-row-is-spec-row, #no-real-data). The main fixture cannot
# be the zero-warning key example: its freshness and command adapters are not evaluated at
# P0 (CIR-PROC-PHASE-P0#p0-unevaluated-adapters-are-grey), and every unevaluated adapter
# raises an "adapter not evaluated in this build" warning. So here every monitored item is
# hand-set (`manual:`), and the two half-arc siblings BOTH declare `share:` (no ⚖-R12
# mixed-share warning). `exercise` keeps no adapter on purpose: ⚪ by-choice is an honest
# grey, not a warning (CIR-DATA-STATUS-RESOLUTION#no-adapter-declared).
#
# Resolving this file at the FIXTURE REFERENCE DATE 2026-08-03 (⚖-R24) yields
# `warnings: []` — the strong claim the citing tests assert.
