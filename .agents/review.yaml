# Cross-vendor reviewer subagent for fixer PRs.
#
# Runs as a REQUIRED approval on the fixer's PR. Deliberately a DIFFERENT vendor/model than the
# writer (the Polly pattern) so the reviewer doesn't share the author's blind spots. Read-only on
# the diff; its verdict (approve / request-changes) is the human-review-only-the-fixer gate from the
# operating model. CI status checks (devbox run ci, scan-secrets) run separately; this reviews the
# things a status check can't judge. Project-specific rubric: .agents/review.md.

title: fixer PR reviewer
description: Approve or request changes on a circles fix PR.

model:
  # MUST differ from fix.yaml's model. Set CIRCLES_REVIEW_MODEL to a non-Anthropic model.
  provider: openrouter
  ref: ${CIRCLES_REVIEW_MODEL:-openai/gpt-latest}

params:
  pr:
    description: Pull request number to review.
    required: true

instructions: |
  Review PR #{{ pr }} for the circles fix. Approve ONLY if all hold; otherwise
  request changes with specific, line-anchored comments:

  1. REGRESSION ROW: the diff adds a row to the decision table that fails on the OLD code and
     passes on the new code — and it actually encodes the reported bug (right inputs, right
     expected output). Reject if the "test" can't have caught the bug.
  2. NO DUPLICATE TESTS: new cases are rows in the parametrized table, not copy-pasted test
     functions. Reject a wall of near-identical functions.
  3. NO HIDDEN DATA: fixtures are human-readable tables; no committed binary/base64 blob;
     inputs are built from the table at runtime.
  4. SCOPE: diff is minimal and touches no forbidden path (infra/, chart/, .github/, secrets)
     unless the issue explicitly authorizes it.
  5. NO REAL DATA / NO NEW EGRESS: this repo is public — no real people's data, no new
     S3/network dependency.

  Be terse. Do not rewrite the code; judge it.

extensions:
  - name: shell
    allow:
      - "gh pr view *"
      - "gh pr diff *"
      - "gh pr review *"        # approve / request-changes only

guardrails:
  read_only_repo: true          # may comment/approve, may not push code
