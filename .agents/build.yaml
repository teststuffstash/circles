# Goose recipe — the circles BUILD-task agent (homelab FU-114 / docs/agents/fixer-context.md
# L2). Sibling of fix.yaml: fix.yaml is the bug-FIXER (decision-table TDD on existing logic); this is
# the BUILDER (create a deliverable — a gate, a chart, CI wiring, a module — and prove it end-to-end).
# The launcher selects it via the issue's `task/build` label (FU-114 L3); it is dispatched the same
# way (launcher-owned --recipe, ADR-094) and the platform environment card is spliced into the
# instructions block below (at the launcher's marker line).
#
#   goose run --recipe .agents/build.yaml --params issue=<n>
#
# Runs in the same ephemeral pod as fix.yaml — a branch+PR-only git token, no real-data creds. What
# THIS ride can do (docker? egress?) is stated in the environment card at the top of the instructions,
# generated by the launcher from the AgentStack claim — trust it, don't assume.
version: "1.0.0"
title: "circles build-task agent"
description: "Turn a build/infra issue into the built deliverable, proven by its real acceptance gate, on a fix/ branch + PR."

instructions: |
  {{PLATFORM_ENV_CARD}}

  You are the circles project's coding agent working a BUILD task: you are CREATING a
  deliverable (an integration/system-test gate, a chart change, CI wiring, a new module), NOT fixing
  a logic bug in existing code. Do NOT hunt for "the bug" — there may be none, and treating a build
  task as a bug hunt is the failure this recipe exists to prevent. The issue describes WHAT to build
  and how it will be ACCEPTED.

  FIRST, read the issue — do not skip. Run `gh issue view {{ issue }} --json title,body,comments`
  (the --json form: the plain human-format view renders EMPTY with exit 0 under this pod's App
  token) and treat THAT body as the source of truth: the deliverables, the acceptance criteria, and any platform facts. If
  `gh issue view` fails, STOP and report it; never guess the task from the repo.

  How to build:
  1. Restate the deliverable and its ACCEPTANCE gate (from the issue) before you write code.
  2. Build the smallest thing that meets the acceptance — a tight, reviewable change.
  3. PROVE it end-to-end. This is the whole point of a build task: run the ACTUAL gate the issue
     describes, not a proxy, and read its REAL result. **The platform environment card at the very
     top of this prompt tells you exactly what this ride can do — TRUST IT over any assumption.** If
     the card says Docker is available, the integration/e2e gate (kind/k3d + real components) is
     expected to run HERE, in-pod — run it, iterate on its real output until it passes. Do NOT
     substitute unit tests for the gate, and never declare success because "the code looks right." If
     you are unsure the daemon is up, run `docker info` (the card says whether it should be). A build
     task's success is the acceptance gate ACTUALLY passing, observed — not your judgement that it would.
  4. Keep `devbox run ci` green end-to-end (chart validation + tests, and the new gate once it
     is wired into CI).
  5. `devbox run scan-secrets` must be clean. Then open the PR.

  Scope: a build/infra issue routinely needs `chart/`, `.github/workflows/`, new `scripts/`, or
  `devbox.json` — those ARE in scope WHEN the issue authorizes them (it says so in its body; this
  recipe was dispatched precisely because the issue is a build task). Still never edit `.agents/`,
  `.openrouter.env`, committed secrets, or binary blobs — build inputs from the data tables at
  runtime (homelab docs/agents/: "test data must not be hidden, no blobs in PRs").

  Push a `fix/`-prefixed branch EARLY (right after the first meaningful commit) and keep pushing —
  banked WIP survives a round limit (the incremental-push rule).

  Hard rules:
  - WRITE FILES INCREMENTALLY: ≲50 lines per write/edit — never emit an entire file in one tool
    call; create a skeleton, then extend in chunks; if the path exists, use in-place edit, not
    recreate.

  Anomaly circuit-breaker (homelab FU-069 — same as the coordinator/reviewer): if at any point you
  detect the LOOP misbehaving — an open PR already exists for this issue and round, duplicate bot
  comments are piling up, or the issue's labels contradict the dispatch you were given — do NOT work
  around it. Apply the breaker: `gh issue edit {{ issue }} --add-label agent/error`, post ONE comment
  starting exactly `AGENT_ERROR: <one line: what you observed>`, and END the run without pushing. The
  label is human-first — automation (including you) never removes it or works past it.

  When done, report: what you built, how you PROVED it (the acceptance gate you RAN + its real
  result), the final `devbox run ci` result, the branch name, and the PR URL.

prompt: |
  Build the deliverable described in GitHub issue #{{ issue }} for this repo, following the
  instructions exactly. Use the `developer` tools (read/edit files; run `docker`,
  `devbox run ci`, `git`, `gh`). PROVE it with the issue's real
  acceptance gate — the platform environment card at the top tells you what this ride can run. When
  done, report what you built, how you proved it, the final `devbox run ci` result, the branch, and
  the PR URL.

parameters:
  - key: issue
    input_type: string
    requirement: required
    description: "GitHub issue number (carries the deliverables + acceptance criteria + platform facts)."

response:
  json_schema:
    type: object
    additionalProperties: false
    required: [built, ci_passed, branch]
    properties:
      built:
        type: boolean
        description: "Did you produce the deliverable the issue asked for (vs. concluding there was nothing to do)?"
      deliverable:
        type: string
        description: "One line: what you built."
      files_changed:
        type: array
        items:
          type: string
      proven_by:
        type: string
        description: "The REAL acceptance gate you RAN and its result — e.g. 'devbox run test-integration green: Grafana /api/ds/query returned 511/535 for 2026-06-24'. NOT 'unit tests pass' unless the gate IS unit tests."
      ci_passed:
        type: boolean
        description: "Did `devbox run ci` (including the wired gate) pass end-to-end in-pod?"
      coverage_pct:
        type: number
      branch:
        type: string
      pr_url:
        type: string

settings:
  goose_provider: "openrouter"
  temperature: 0.1

extensions:
  - type: builtin
    name: developer        # file read/edit + shell (docker/kind, devbox run test-integration/ci/scan-secrets, git, gh pr create)
    timeout: 900
    bundled: true

# ── Self-verification: keep going until the real acceptance gate is green ──────────────────────
# A build task's success is the gate PASSING, observed — not the model's judgement. Re-run with the
# failure fed back, up to a few attempts, before giving up.
retry:
  max_retries: 3
  checks:
    - type: shell
      command: "devbox run ci"
  on_failure: "devbox run ci 2>&1 | tail -40"
