# circles production nginx config — serves the baked static site
#
# The bake produces index.html (with inlined artifact data) and data.json.
# nginx-unprivileged runs as non-root user 101, so all served files must be
# world-readable (CIR-BAKE-ATOMIC-WRITE#permissions-world-readable).

server {
    listen       8080;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Serve .json files with the correct Content-Type so consuming tools
    # (e.g. the kind-system gate, external consumers) get parseable JSON.
    location ~* \.json$ {
        add_header Content-Type application/json;
        try_files $uri =404;
    }
}