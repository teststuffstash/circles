{{- /* The nightly bake (circles-iac docs/deploy-seam.md §"Pod shape", ADR-003). The source is a
       private bucket the person's notes repo publishes a whitelisted export into; its reader key
       lives ONLY in Secret files under /secrets/source — no env var references the Secret
       (CIR-ADAPT-BUDGET#environment-not-inherited-wholesale), no key value reaches an argv. */ -}}
{{- if .Values.bake.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-bake
  labels: { app.kubernetes.io/name: {{ .Chart.Name }}-bake }
spec:
  schedule: {{ .Values.bake.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: { app.kubernetes.io/name: {{ .Chart.Name }}-bake }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          activeDeadlineSeconds: 600
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            seccompProfile: { type: RuntimeDefault }
          affinity:
            podAffinity:
              # RWO volume: the bake must land on the page pod's node.
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: { app.kubernetes.io/name: {{ .Chart.Name }} }
                  topologyKey: kubernetes.io/hostname
          initContainers:
            - name: copy-source
              image: "{{ .Values.bake.image.repository }}:{{ .Values.bake.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.bake.image.pullPolicy }}
              workingDir: /src
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  # Keys: read through a pipe (cat's argv is the PATH, never the value) and written
                  # by the printf builtin into a 0600 rclone config on the emptyDir — never an
                  # argv, never the environment. Not `read -r`: Secret files carry no trailing
                  # newline, so `read` returns 1 at EOF and `sh -e` would exit silently.
                  bucket=$(cat /secrets/source/bucket)
                  ak=$(cat /secrets/source/reader_access_key_id)
                  sk=$(cat /secrets/source/reader_secret_access_key)
                  umask 077
                  printf '[src]\ntype = s3\nprovider = Other\nendpoint = %s\nregion = %s\nforce_path_style = true\naccess_key_id = %s\nsecret_access_key = %s\n' \
                    "$S3_ENDPOINT" "$S3_REGION" "$ak" "$sk" > /tmp/rclone.conf
                  unset ak sk
                  rclone copy --config /tmp/rclone.conf "src:$bucket" /src/source
                  rm -f /tmp/rclone.conf
                  # S3 keeps no file modes: a copied file that starts with a shebang is an
                  # executable (a `command:` adapter script, CIR-ADAPT-COMMAND) — mark it so.
                  umask 022
                  find /src/source -type f | while read -r f; do
                    [ "$(head -c 2 "$f")" = '#!' ] && chmod 0755 "$f" || chmod 0644 "$f"
                  done
                  echo "copied $(find /src/source -type f | wc -l) files from $bucket"
              env:
                - { name: HOME, value: /tmp }
                - { name: S3_ENDPOINT, value: {{ .Values.bake.s3.endpoint | quote }} }
                - { name: S3_REGION, value: {{ .Values.bake.s3.region | quote }} }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources: {{- toYaml .Values.bake.resources | nindent 16 }}
              volumeMounts:
                - { name: source-secret, mountPath: /secrets/source, readOnly: true }
                - { name: src, mountPath: /src }
                - { name: tmp, mountPath: /tmp }
          containers:
            - name: bake
              image: "{{ .Values.bake.image.repository }}:{{ .Values.bake.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.bake.image.pullPolicy }}
              # the image's venv python directly — uid 101 cannot write uv's caches
              workingDir: /build
              command: ["/build/.venv/bin/python", "-m", "bake"]
              args:
                - --config
                - /src/source/{{ .Values.bake.configPath }}
                - --out
                - /content
                - --evaluate
                - --stale-after-hours
                - {{ .Values.bake.staleAfterHours | quote }}
              env:
                - { name: HOME, value: /tmp }
                - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources: {{- toYaml .Values.bake.resources | nindent 16 }}
              volumeMounts:
                - { name: src, mountPath: /src, readOnly: true }
                - { name: content, mountPath: /content }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: source-secret
              secret:
                secretName: {{ .Values.bake.sourceSecretName }}
                defaultMode: 0440
                items: # the reader half only — the writer key belongs to the notes repo's CI
                  - { key: bucket, path: bucket }
                  - { key: reader_access_key_id, path: reader_access_key_id }
                  - { key: reader_secret_access_key, path: reader_secret_access_key }
            - { name: src, emptyDir: {} }
            - { name: tmp, emptyDir: {} }
            - name: content
              persistentVolumeClaim: { claimName: {{ .Values.content.claimName }} }
{{- end }}
