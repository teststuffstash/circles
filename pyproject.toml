[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circles-bake"
version = "0.1.0"
description = "The circles P0 bake: circles.yaml -> a validated, typed config model"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "PyYAML>=6.0",
    "tzdata>=2026.3",
]

[tool.setuptools.packages.find]
include = ["bake*"]

[dependency-groups]
browser = [
    "playwright==1.62.0",
    "pypdf>=6.17.0",
]
dev = [
    "allure-pytest>=2.16.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The browser tier (tests/browser, CIR-PROC-BROWSER-EVIDENCE) needs headless Chromium and a
# served page; the unit run in scripts/ci.sh (`pytest tests/`) must not collect it. The harness
# `scripts/test-browser.sh` overrides this with `-o addopts=` when it targets tests/browser.
addopts = "--ignore=tests/browser"
markers = [
    "rule: the spec rule a test proves — applied only via tests/rules.py `rule()` (story label = rule ID)",
    "browser: system-tier browser evidence (CIR-PROC-BROWSER-EVIDENCE, ⚖-R48) — run via `devbox run test-browser`",
]
