# Specs site — mkdocs renders specs/ (+ docs/ when present) verbatim; zero custom rendering
# code (oracle-fleet is the reference; same pinned-engine rule). Published by
# scripts/specs-publish.sh to the `circles-specs` bucket, served via the circles gateway
# (ADR-092): master → https://specs.circles.teststuff.net, per-PR previews →
# https://specs-<N>.circles.teststuff.net (LAN/VPN-only).
site_name: circles specs
# .site-src mirrors the repo-root layout (specs/ + docs/ + a generated index.md, staged by
# scripts/specs-build.sh — mkdocs refuses docs_dir: ".") so cross-tree links resolve without
# rewriting spec text.
docs_dir: .site-src
site_dir: specs-site
# Object-store hosting: emit real .html files and link them explicitly — Garage's website
# index document is not guaranteed for nested directory URLs (specs-build.sh generates
# index.html listings for directories that lack one).
use_directory_urls: false
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: light mode }
  features:
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
