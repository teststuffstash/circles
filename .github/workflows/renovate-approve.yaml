# renovate-approve.yaml — the "reviewer approves Renovate" half of hands-off dep bumps.
# Thin caller of the platform's reusable workflow (homelab/.github/workflows/renovate-approve.reusable.yml),
# which carries the idempotency guard: it approves ONCE per head sha instead of on every PR event
# (homelab#114 — the inline copy here re-approved on every synchronize/labeled event, 5× on #148).
# pull_request_target: runs the BASE branch's workflow with secrets and executes NO head code.
name: renovate-approve

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions: {} # uses the reviewer App token, not GITHUB_TOKEN

jobs:
  approve:
    uses: teststuffstash/homelab/.github/workflows/renovate-approve.reusable.yml@master
    secrets: inherit
