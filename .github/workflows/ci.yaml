# circles CI — thin. All logic lives in `devbox run <task>` (devbox.json + scripts/),
# so the exact same gate runs locally and here, and tool versions are pinned by devbox, not by
# this YAML. Swapping the runner (self-hosted ARC → Blacksmith/Chainguard) needs no logic change.
#
# Runs on the homelab self-hosted runner (Actions Runner Controller, ephemeral laptop tier):
# runs-on: homelab-ephemeral.
#
# The PR run is the required-check gate that must be green before merge. push:master runs too, but
# NOT as a gate (it fires in parallel with deploy.yaml and can't stop it): it exists so master
# re-earns its OWN evidence against the merged sha and the `evidence` job publishes the master specs
# site with it (homelab ADR-156 / oracle-fleet shape, circles#103) — a PR run never writes master's
# "latest". This replaced specs-site.yaml, which published master from committed text only.
name: CI

on:
  pull_request:
    # `goal/**` = a goal's INTEGRATION branch (homelab FU-090 leg (c)): a stacked base that a
    # goal's child PRs merge INTO before the goal itself reaches master. It carries the SAME
    # ruleset as master (required-checks + required-approval), and a required check is only real
    # if the workflow producing it TRIGGERS on that branch — otherwise the PR waits forever on a
    # check that can never report. Found exactly that way: circles#24 sat APPROVED + armed and
    # permanently BLOCKED, because `ci` was required on goal/** and this trigger said master only.
    branches: [master, 'goal/**']
  push:
    branches: [master]
  workflow_dispatch: {}

# One live run per PR (org standard — homelab docs/ci.md §Concurrency, from oracle-fleet#222):
# a superseded PR head's run cancels instead of queuing; push/master runs keep their own serial
# group and never cancel (a cancelled push run can leave a publish half-written).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── e2e: the kind system-test tier, on the long-lived VM runner ─────────────────────────
  # homelab docs/patterns/python-stack.md §CI job shape: the fast gate (ephemeral, no docker)
  # runs IN PARALLEL with the kind e2e on the VM runner (docker daemon, two slots, ADR-082) —
  # the merge-blocking wall is max(gate, e2e), never the sum. Before this job existed the
  # system tier self-skipped on every PR run ("docker daemon not reachable") and was exercised
  # only by docker-mode agent rides. The script is run-scoped + self-sweeping + mirror-wired per
  # docs/patterns/kind-ci.md. Not yet a REQUIRED check (that is a homelab tofu/github ruleset
  # change) — make it required once it has a green streak.
  e2e:
    runs-on: [self-hosted, proxmox-vm]
    timeout-minutes: 30
    # a PR head and its identical push:master sha never hold two VM slots at once (oracle-fleet)
    concurrency: e2e-${{ github.sha }}
    # The evidence stamp (tests/conftest.py → environment.properties git.commit): the PR HEAD, not
    # the test-merge commit GITHUB_SHA names on pull_request (allure-behavior-snippets CONVENTIONS
    # § The head/artifact stamp).
    env:
      CIRCLES_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Kind system test (devbox run test-system)
        run: devbox run test-system
      # Browser evidence tier (CIR-PROC-BROWSER-EVIDENCE, #34): headless Chromium in the
      # Playwright image renders the baked page and asserts the CIR-RENDER rows. Runner forced
      # to docker so a missing daemon is a red step, never the script's graceful SKIP.
      - name: Browser evidence (devbox run test-browser)
        if: always()
        env:
          CIRCLES_BROWSER_RUNNER: docker
        run: devbox run test-browser
      # Raw Allure results for the trailing `evidence` job. A red or skipped browser run still
      # uploads what it has; an absent artifact renders the browser rows as ∅ there, never PASS.
      - name: Upload browser Allure results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-allure-results
          path: allure-results-browser/
          retention-days: 1 # homelab GithubStorageHeldHigh — the published site is the record
          if-no-files-found: warn

  ci:
    runs-on: homelab-ephemeral
    # The evidence stamp (tests/conftest.py → environment.properties git.commit): the PR HEAD, not
    # the test-merge commit GITHUB_SHA names on pull_request (allure-behavior-snippets CONVENTIONS
    # § The head/artifact stamp).
    env:
      CIRCLES_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No toolchain install: the ARC runner image bakes single-user Nix + devbox + the LAN
      # nix substituter (homelab docker/arc-runner/, FU-015).
      # The kind system tier is the e2e job's (above). Since the ephemeral runner gained a docker
      # daemon (seen 2026-10-16), `devbox run ci` started running test-system here too — two kind
      # clusters per PR, and the duplicate flaked (etcd timeout on #99). Skip it here explicitly.
      - name: Chart validation + unit tests (devbox run ci)
        env:
          CIRCLES_SYSTEM_TEST_SKIP: "1"
        run: devbox run ci

      - name: Secret scan (devbox run scan-secrets)
        run: devbox run scan-secrets

      - name: Upload unit Allure results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-allure-results
          path: allure-results/
          retention-days: 1
          if-no-files-found: warn

  # ── evidence: the trailing, NON-required publish job (homelab python-stack.md §CI job shape,
  # kind-ci.md rule 8; oracle-fleet's ci.yaml) ────────────────────────────────────────────────
  # Merges the unit + browser Allure results (uuid-named files — a copy is the merge), renders the
  # reviewer pack + per-rule fragments with the pinned allure-behavior-snippets (`devbox run
  # evidence`, circles#103 / homelab ADR-156) and publishes the specs site with the fragments
  # transcluded: PR runs → pr-<N>/ (https://specs-<N>.circles.teststuff.net), push:master → the
  # bucket root (https://specs.circles.teststuff.net). `if: always()` + continue-on-error
  # downloads: a red or skipped tier still publishes what exists, and its rows read ∅.
  evidence:
    needs: [ci, e2e]
    if: always()
    runs-on: homelab-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download unit + browser Allure results
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-allure-results"
          path: allure-merged/
          merge-multiple: true

      - name: Evidence pack + fragments (devbox run evidence)
        run: |
          mkdir -p allure-merged
          devbox run evidence -- allure-merged allure-evidence

      - name: Upload the evidence pack
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: circles-evidence
          path: allure-evidence/
          retention-days: 1
          if-no-files-found: warn

      # specs-publish.sh soft-skips when the SPECS_S3_* secrets are absent; SITE_PREFIX empty =
      # the bucket root (master).
      - name: Site identity
        id: site
        run: echo "prefix=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish specs site
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
        env:
          SPECS_S3_ENDPOINT: http://garage.garage.svc.cluster.local:3900
          SPECS_S3_ACCESS_KEY_ID: ${{ secrets.SPECS_S3_ACCESS_KEY_ID }}
          SPECS_S3_SECRET_ACCESS_KEY: ${{ secrets.SPECS_S3_SECRET_ACCESS_KEY }}
          SITE_PREFIX: ${{ steps.site.outputs.prefix }}
        run: devbox run specs-publish

      # The preview's front door: a sticky comment on the PR with its specs-site URL
      # (edited in place on reruns — never a comment per run).
      - name: Link the specs preview on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devbox run -- bash scripts/specs-preview-comment.sh "${{ github.event.number }}"
