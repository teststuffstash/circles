# circles CI — thin. All logic lives in `devbox run <task>` (devbox.json + scripts/),
# so the exact same gate runs locally and here, and tool versions are pinned by devbox, not by
# this YAML. Swapping the runner (self-hosted ARC → Blacksmith/Chainguard) needs no logic change.
#
# Runs on the homelab self-hosted runner (Actions Runner Controller, ephemeral laptop tier):
# runs-on: homelab-ephemeral.
#
# pull_request ONLY (no push:master): the PR run is the required-check gate that must be green before
# merge. On a squash-merge the master commit is identical content, so re-running on master would just
# re-test the same tree — and it fires in PARALLEL with deploy.yaml (which doesn't wait for it), so it
# can't gate a deploy anyway. The PR gate is the control; a direct admin push to master is the only
# untested path and a parallel job couldn't stop it regardless.
name: CI

on:
  pull_request:
    # `goal/**` = a goal's INTEGRATION branch (homelab FU-090 leg (c)): a stacked base that a
    # goal's child PRs merge INTO before the goal itself reaches master. It carries the SAME
    # ruleset as master (required-checks + required-approval), and a required check is only real
    # if the workflow producing it TRIGGERS on that branch — otherwise the PR waits forever on a
    # check that can never report. Found exactly that way: circles#24 sat APPROVED + armed and
    # permanently BLOCKED, because `ci` was required on goal/** and this trigger said master only.
    branches: [master, 'goal/**']
  workflow_dispatch: {}

jobs:
  ci:
    runs-on: homelab-ephemeral
    steps:
      - uses: actions/checkout@v4

      # No toolchain install: the ARC runner image bakes single-user Nix + devbox + the LAN
      # nix substituter (homelab docker/arc-runner/, FU-015).
      - name: Chart validation + unit tests (devbox run ci)
        run: devbox run ci

      - name: Secret scan (devbox run scan-secrets)
        run: devbox run scan-secrets

      # ── specs-site preview (ADR-092) ─────────────────────────────────────────────────────
      # PR runs render the specs site into the pr-<N>/ bucket prefix →
      # https://specs-<N>.circles.teststuff.net (route lifecycle: specs-pr-site.yaml). The
      # master site is published by specs-site.yaml on merge — never from here. `if: always()`
      # so a red gate still publishes the render (seeing the failing spec tree is the point).
      # specs-publish.sh soft-skips when the SPECS_S3_* secrets are absent.
      - name: Site identity
        id: site
        if: github.event_name == 'pull_request'
        run: echo "prefix=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"

      - name: Publish specs site (PR preview)
        if: always() && github.event_name == 'pull_request'
        env:
          SPECS_S3_ENDPOINT: http://garage.garage.svc.cluster.local:3900
          SPECS_S3_ACCESS_KEY_ID: ${{ secrets.SPECS_S3_ACCESS_KEY_ID }}
          SPECS_S3_SECRET_ACCESS_KEY: ${{ secrets.SPECS_S3_SECRET_ACCESS_KEY }}
          SITE_PREFIX: ${{ steps.site.outputs.prefix }}
        run: devbox run specs-publish

      # The preview's front door: a sticky comment on the PR with its specs-site URL
      # (edited in place on reruns — never a comment per run).
      - name: Link the specs preview on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devbox run -- bash scripts/specs-preview-comment.sh "${{ github.event.number }}"
