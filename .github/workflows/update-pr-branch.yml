# Deterministic merge-path UPDATER — the head-of-line serializer from homelab FU-041
# (homelab/docs/agents/merge-path.md §Chosen design ▸2). Its whole job: keep exactly ONE PR current
# with master so GitHub auto-merge can actually fire.
#
# WHY THIS EXISTS. The branch-protection ruleset requires an up-to-date branch before merge
# (strict_required_status_checks_policy). Nothing updates a PR branch when master moves, so an
# approved + green + auto-merge-armed PR that falls BEHIND stalls silently forever. adRise/update-pr-branch
# merges master into the oldest qualifying PR (one per run, FIFO) via the update-branch API — a merge
# commit, never a rebase (no history rewrite; a stale worker clone still `git pull`s cleanly).
#
# UPDATE-BEFORE-REVIEW (required_approval_count: 0): the PR is brought current+green BEFORE the reviewer
# runs, so approval is the LAST event and auto-merge fires immediately — one reviewer run per PR. Reviewing
# first would let the update push dismiss the fresh approval (dismiss_stale_reviews_on_push) → double reviews.
#
# TOKEN. MUST be a GitHub App token, NOT GITHUB_TOKEN — a GITHUB_TOKEN push does not re-trigger the PR's
# `ci` checks, so a strict branch would never see green after the update. Minted from the DEDICATED
# `homelab-merge` App (contents:write + read-only PR/checks) — NOT homelab-agents, whose broad key must not
# be copied into the CI plane (see docs/agents/merge-path.md §Updater token). No self-approval conflict: the
# updater only pushes + reads, never approves, and require_last_push_approval=false.
#
#   OPERATOR ONE-TIME: bootstrap the App (scripts/github-merge-app-bootstrap.sh) then publish its id+key as
#   the MERGE_GH_APP_* org Actions secrets via `devbox run github-tofu apply` (docs/github-setup.md §4).
#
# Identical across agent repos — extract to a reusable org workflow when a third repo appears (FU-041).
name: update-pr-branch

on:
  push:
    branches: [master]           # something merged → the next head-of-line PR is now behind
  workflow_run:
    workflows: [CI]              # a PR went green while behind → it just became eligible
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"       # sweeper: catches a PR that goes green while master is quiet
  workflow_dispatch:

# Serialize runs — the updater is a one-at-a-time head-of-line server; never let two ticks race.
concurrency:
  group: update-pr-branch
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write                  # label conflicted PRs (Phase 3)

jobs:
  update:
    # GitHub-hosted on purpose: the merge path must not depend on the self-hosted ephemeral tier being
    # awake. This is an API-only job (seconds), so metered minutes are negligible.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.MERGE_GH_APP_ID }}
          private-key: ${{ secrets.MERGE_GH_APP_PRIVATE_KEY }}
          # No permission-* down-scoping: the homelab-merge App is already minimal (contents:write +
          # read-only PR/checks), so the token gets exactly that — nothing to trim.

      - name: Update the oldest behind, green, auto-merge-armed PR
        uses: adRise/update-pr-branch@v0.10
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: master
          required_approval_count: 0        # update BEFORE review — see header
          require_passed_checks: true       # only update green PRs (don't churn a red branch)
          require_auto_merge_enabled: true  # only PRs that are actually queued to land
          sort: created
          direction: asc                    # FIFO (the action defaults to newest-first)

      - name: Flag conflicted PRs (Phase 3 — updater can't auto-resolve these)
        env:
          GH_TOKEN: ${{ github.token }}     # labeling doesn't need to re-trigger CI → plain GITHUB_TOKEN
        run: |
          set -euo pipefail
          # An auto-merge-armed PR whose branch conflicts with master (mergeStateStatus == DIRTY) can never
          # be auto-updated (update-branch returns 422) → never becomes current → never reviewed/merged.
          # Surface it for the coordinator with `merge-conflict`; clear the label once it's resolved.
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,mergeStateStatus,autoMergeRequest,labels \
          | jq -c '.[]' | while read -r pr; do
              n=$(printf '%s' "$pr" | jq -r '.number')
              armed=$(printf '%s' "$pr" | jq -r '.autoMergeRequest != null')
              dirty=$(printf '%s' "$pr" | jq -r '.mergeStateStatus == "DIRTY"')
              has=$(printf '%s' "$pr" | jq -r '[.labels[].name] | index("merge-conflict") != null')
              if [ "$armed" = "true" ] && [ "$dirty" = "true" ]; then
                [ "$has" = "true" ] || gh pr edit "$n" --repo "$GITHUB_REPOSITORY" --add-label merge-conflict
              elif [ "$has" = "true" ]; then
                gh pr edit "$n" --repo "$GITHUB_REPOSITORY" --remove-label merge-conflict || true
              fi
            done
